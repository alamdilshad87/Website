<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace,Consolas,monospace">
  <!-- Placeholder cover: replace with a real SpecGuard screenshot (1200x750). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141833"/><stop offset="1" stop-color="#07080E"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#F2EFE9" opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="750" fill="url(#dots)"/>
  <g transform="translate(80 70)">
    <rect width="1040" height="610" rx="14" fill="#10131F" stroke="#F2EFE9" stroke-opacity=".18"/>
    <circle cx="28" cy="26" r="7" fill="#FF5A1F"/><circle cx="52" cy="26" r="7" fill="#9AA8FF"/><circle cx="76" cy="26" r="7" fill="#1DE9A6"/>
    <text x="520" y="31" fill="#A7ABC0" font-size="15" text-anchor="middle">specguard · compare v1.4 → v2.0</text>
    <line x1="0" y1="52" x2="1040" y2="52" stroke="#F2EFE9" stroke-opacity=".12"/>
    <rect x="0" y="52" width="220" height="558" fill="#0C0E19"/>
    <g font-size="15" fill="#A7ABC0">
      <text x="24" y="92" fill="#FF7A3D">ENDPOINTS</text>
      <text x="24" y="128">GET  /users</text>
      <rect x="12" y="144" width="196" height="30" rx="4" fill="#FF5A1F" fill-opacity=".18"/>
      <text x="24" y="164" fill="#F2EFE9">GET  /users/{id}</text>
      <text x="24" y="200">POST /users</text><text x="24" y="236">GET  /orders</text><text x="24" y="272">PUT  /orders/{id}</text>
      <text x="24" y="330" fill="#FF7A3D">REPORT</text>
      <text x="24" y="366">2 breaking</text><text x="24" y="398">5 additive</text><text x="24" y="430">11 unchanged</text>
    </g>
    <g font-size="17">
      <text x="260" y="98" fill="#F2EFE9" font-size="22" font-family="Arial Black,Arial,sans-serif">GET /users/{id}  ·  200</text>
      <rect x="260" y="124" width="740" height="40" fill="#FF5A1F" fill-opacity=".14"/>
      <text x="278" y="150" fill="#FF7A3D">-   "email": string</text>
      <rect x="260" y="168" width="740" height="40" fill="#1DE9A6" fill-opacity=".12"/>
      <text x="278" y="194" fill="#2BE8B0">+   "contact": { "email": string }</text>
      <text x="278" y="238" fill="#A7ABC0">    "id": uuid</text><text x="278" y="276" fill="#A7ABC0">    "name": string</text>
      <rect x="260" y="312" width="740" height="92" rx="8" fill="none" stroke="#FF5A1F" stroke-opacity=".7"/>
      <text x="282" y="346" fill="#FF7A3D" font-size="15">BREAKING · response field moved</text>
      <text x="282" y="378" fill="#F2EFE9" font-size="15">Clients reading "email" at the top level will get undefined.</text>
      <rect x="260" y="432" width="740" height="140" rx="8" fill="#161A2B"/>
      <text x="282" y="466" fill="#9AA8FF" font-size="15">ask the spec ›</text>
      <text x="282" y="500" fill="#F2EFE9" font-size="15">Which endpoints changed their auth requirements?</text>
      <text x="282" y="536" fill="#A7ABC0" font-size="15">RAG · 3 sources · PUT /orders/{id} now requires scope orders:write</text>
    </g>
  </g>
